<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - percentage-closer soft shadows</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgpu - percentage-closer soft shadows">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgpu_shadowmap_pcss.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgpu_shadowmap_pcss.jpg">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Percentage-Closer Soft Shadows</span>
			</div>

			<small>
				Contact-hardening soft shadows for directional, spot and point lights.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';

			import { PCSSShadowFilter } from 'three/addons/tsl/shadows/PCSSShadowFilter.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			const POINT_LIGHT_INTENSITY = 250;
			const POINT_LIGHT_POSITION = new THREE.Vector3( 3, 8, 2 );

			let camera, scene, renderer, timer;
			let group, lights, shadowCameraHelper;

			const params = {
				light: 'directional',
				directionalSize: 0.08,
				spotSize: 0.3,
				pointSize: 0.15,
				flicker: true,
				animate: true
			};

			init();

			function init() {

				camera = new THREE.PerspectiveCamera( 30, window.innerWidth / window.innerHeight, 1, 10000 );
				camera.position.set( 7, 13, 7 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xcce0ff );
				scene.fog = new THREE.Fog( 0xcce0ff, 5, 100 );

				// lights

				scene.add( new THREE.AmbientLight( 0xaaaaaa, 3 ) );

				const directionalLight = new THREE.DirectionalLight( 0xf0f6ff, 4.5 );
				directionalLight.position.set( 2, 8, 4 );
				directionalLight.castShadow = true;
				directionalLight.shadow.mapSize.set( 1024, 1024 );
				directionalLight.shadow.camera.far = 20;
				directionalLight.shadow.normalBias = 0.02;
				directionalLight.shadow.filterNode = PCSSShadowFilter( { lightSize: params.directionalSize } );
				scene.add( directionalLight );

				shadowCameraHelper = new THREE.CameraHelper( directionalLight.shadow.camera );
				scene.add( shadowCameraHelper );

				const spotLight = new THREE.SpotLight( 0xf0f6ff, 400 );
				spotLight.position.set( 2, 8, 4 );
				spotLight.angle = Math.PI / 5;
				spotLight.penumbra = 0.3;
				spotLight.castShadow = true;
				spotLight.shadow.mapSize.set( 1024, 1024 );
				spotLight.shadow.camera.near = 1;
				spotLight.shadow.camera.far = 20;
				spotLight.shadow.normalBias = 0.02;
				spotLight.shadow.filterNode = PCSSShadowFilter( { lightSize: params.spotSize } );
				scene.add( spotLight );

				const pointLight = new THREE.PointLight( 0xffb070, POINT_LIGHT_INTENSITY );
				pointLight.position.copy( POINT_LIGHT_POSITION );
				pointLight.castShadow = true;
				pointLight.shadow.mapSize.set( 1024, 1024 );
				pointLight.shadow.camera.near = 1;
				pointLight.shadow.camera.far = 30;
				pointLight.shadow.normalBias = 0.02;
				pointLight.shadow.filterNode = PCSSShadowFilter( { lightSize: params.pointSize } );
				scene.add( pointLight );

				lights = { directional: directionalLight, spot: spotLight, point: pointLight };

				updateLights();

				// group

				group = new THREE.Group();
				scene.add( group );

				const geometry = new THREE.SphereGeometry( 0.3, 20, 20 );

				for ( let i = 0; i < 20; i ++ ) {

					const material = new THREE.MeshPhongNodeMaterial( { color: Math.random() * 0xffffff } );

					const sphere = new THREE.Mesh( geometry, material );
					sphere.position.x = Math.random() - 0.5;
					sphere.position.z = Math.random() - 0.5;
					sphere.position.normalize();
					sphere.position.multiplyScalar( Math.random() * 2 + 1 );
					sphere.castShadow = true;
					sphere.receiveShadow = true;
					sphere.userData.phase = Math.random() * Math.PI;
					group.add( sphere );

				}

				// ground

				const groundMaterial = new THREE.MeshPhongNodeMaterial( { color: 0x898989 } );

				const ground = new THREE.Mesh( new THREE.PlaneGeometry( 20000, 20000, 8, 8 ), groundMaterial );
				ground.rotation.x = - Math.PI / 2;
				ground.receiveShadow = true;
				scene.add( ground );

				// column

				const column = new THREE.Mesh( new THREE.BoxGeometry( 1, 4, 1 ), groundMaterial );
				column.position.y = 2;
				column.castShadow = true;
				column.receiveShadow = true;
				scene.add( column );

				// renderer

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				// controls

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.maxPolarAngle = Math.PI * 0.5;
				controls.minDistance = 10;
				controls.maxDistance = 75;
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				// gui

				const gui = renderer.inspector.createParameters( 'Settings' );

				gui.add( params, 'light', [ 'directional', 'spot', 'point' ] ).onChange( updateLights );

				gui.add( params, 'directionalSize', 0, 0.2 ).name( 'directional size' ).onChange( function ( value ) {

					directionalLight.shadow.filterNode.lightSize.value = value;

				} );

				gui.add( params, 'spotSize', 0, 1 ).name( 'spot size' ).onChange( function ( value ) {

					spotLight.shadow.filterNode.lightSize.value = value;

				} );

				gui.add( params, 'pointSize', 0, 1 ).name( 'point size' ).onChange( function ( value ) {

					pointLight.shadow.filterNode.lightSize.value = value;

				} );

				gui.add( params, 'flicker' ).name( 'point flicker' );
				gui.add( params, 'animate' );

				//

				timer = new THREE.Timer();
				timer.connect( document );

				window.addEventListener( 'resize', onWindowResize );

			}

			function updateLights() {

				for ( const type in lights ) {

					lights[ type ].visible = ( type === params.light );

				}

				shadowCameraHelper.visible = ( params.light === 'directional' );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				timer.update();

				const time = timer.getElapsed();

				if ( params.animate === true ) {

					group.traverse( function ( child ) {

						if ( 'phase' in child.userData ) {

							child.position.y = Math.abs( Math.sin( time + child.userData.phase ) ) * 4 + 0.3;

						}

					} );

				}

				// a flickering fire: the intensity varies and the light moves slightly, so its shadows sway

				const pointLight = lights.point;

				if ( params.flicker === true ) {

					const t = time * 8;
					const flicker = Math.sin( t ) * 0.5 + Math.sin( t * 2.3 + 1 ) * 0.3 + Math.sin( t * 5.7 + 2 ) * 0.2;

					pointLight.intensity = POINT_LIGHT_INTENSITY * ( 1 + flicker * 0.2 );
					pointLight.position.set(
						POINT_LIGHT_POSITION.x + Math.sin( t * 1.7 ) * 0.05,
						POINT_LIGHT_POSITION.y + Math.sin( t * 2.9 ) * 0.05,
						POINT_LIGHT_POSITION.z + Math.cos( t * 1.3 ) * 0.05
					);

				} else {

					pointLight.intensity = POINT_LIGHT_INTENSITY;
					pointLight.position.copy( POINT_LIGHT_POSITION );

				}

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
